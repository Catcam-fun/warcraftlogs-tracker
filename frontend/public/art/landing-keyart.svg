<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="void" cx="74%" cy="14%" r="80%">
      <stop offset="0%" stop-color="#3a2c8c"/>
      <stop offset="32%" stop-color="#221a52"/>
      <stop offset="64%" stop-color="#0d0b22"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="rift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b8cff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6a4fd0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6a4fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#04050b"/>
      <stop offset="100%" stop-color="#04050b" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#void)"/>

  <!-- void rifts -->
  <g filter="url(#soft)" opacity="0.85">
    <ellipse cx="1180" cy="150" rx="520" ry="360" fill="url(#rift)"/>
    <ellipse cx="430" cy="640" rx="420" ry="300" fill="url(#rift)" opacity="0.4"/>
  </g>

  <!-- energy streaks -->
  <g stroke="#8f7dff" stroke-width="1.4" opacity="0.20" fill="none">
    <path d="M1600 60 C 1200 220, 900 260, 540 520"/>
    <path d="M1560 0 C 1240 180, 980 300, 720 560"/>
    <path d="M1600 200 C 1300 320, 1040 360, 820 600"/>
  </g>

  <!-- stars -->
  <g fill="#cdd0ff">
    <circle cx="240" cy="120" r="1.3" opacity="0.7"/>
    <circle cx="520" cy="80" r="1" opacity="0.5"/>
    <circle cx="900" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="1320" cy="240" r="1.1" opacity="0.6"/>
    <circle cx="1480" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="160" cy="360" r="1" opacity="0.45"/>
    <circle cx="700" cy="200" r="1.1" opacity="0.55"/>
    <circle cx="1120" cy="420" r="1" opacity="0.4"/>
    <circle cx="380" cy="260" r="1.2" opacity="0.6"/>
    <circle cx="1240" cy="60" r="1" opacity="0.5"/>
  </g>

  <!-- horizon falloff -->
  <rect y="520" width="1600" height="380" fill="url(#floor)"/>
</svg>
