# Deploy Floor Pov to the hand-built AWS setup (infra/README.md, "What's live
# now"): the Flask API to the Lambda function, the React site to the S3
# bucket, then a CloudFront refresh. Runs on every push to main (a merged pull
# request), and by hand: Actions > "Deploy to AWS" > Run workflow.
#
# Only the code changes. The function's settings and secrets (Supabase keys,
# ORIGIN_VERIFY_SECRET) stay as set in the AWS console.
#
# Setup, once (infra/README.md): the deploy role from
# infra/github-deploy-role.yaml, its RoleArn in the repository secret
# AWS_DEPLOY_ROLE_ARN, and the resource secrets listed in infra/README.md.
# No resource ID lives in this file: this repo and its Actions logs are
# public, and GitHub hides secret values in the logs.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub's OIDC token, exchanged for the AWS deploy role
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  FUNCTION: ${{ secrets.LAMBDA_FUNCTION }}
  BUCKET: ${{ secrets.SITE_BUCKET }}
  DISTRIBUTION: ${{ secrets.CF_DISTRIBUTION_ID }}
  SITE_URL: https://floorpov.gg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m unittest discover -p "test_*.py"

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          CI=true npx react-scripts test --watchAll=false

      - name: Build the API zip and the site
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }}
        run: |
          for v in FUNCTION BUCKET DISTRIBUTION REACT_APP_SUPABASE_URL               REACT_APP_SUPABASE_ANON_KEY REACT_APP_TURNSTILE_SITE_KEY; do
            [ -n "${!v}" ] || { echo "Repository secret for $v is not set (infra/README.md)"; exit 1; }
          done
          infra/build-api-zip.sh api.zip
          cd frontend && REACT_APP_API_URL=same-origin npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Keep the API pointed at the WarcraftLogs proxy
        env:
          WCL_PROXY_URL: ${{ secrets.WCL_PROXY_URL }}
        run: |
          # Adds or updates only WCL_PROXY_URL; the function's other settings
          # stay as set in the console. Nothing here is printed: the function's
          # settings hold the Supabase keys.
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          aws lambda get-function-configuration --function-name "$FUNCTION"             --query Environment.Variables --output json > env.json
          if [ "$(jq -r '.WCL_PROXY_URL // ""' env.json)" != "$WCL_PROXY_URL" ]; then
            jq --arg u "$WCL_PROXY_URL" '{Variables: (. + {WCL_PROXY_URL: $u})}' env.json > env-new.json
            aws lambda update-function-configuration --function-name "$FUNCTION"               --environment file://env-new.json --query LastUpdateStatus --output text
            aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          fi
          rm -f env.json env-new.json

      - name: Deploy the API
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://api.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      - name: Deploy the site
        working-directory: frontend
        run: |
          # Hashed bundles never change: cache them for a year. Old ones stay
          # (no --delete) so a page loaded before the deploy keeps working.
          aws s3 sync build/static "s3://$BUCKET/static" \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (index.html, art, manifest): always revalidate.
          aws s3 sync build "s3://$BUCKET" \
            --exclude "static/*" --exclude "_redirects.txt" \
            --cache-control "public,max-age=0,must-revalidate" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/*" --query Invalidation.Id --output text

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/health") && [ "$code" = 200 ] && break
            sleep 10
          done
          curl -fsS "$SITE_URL/api/health"; echo
          curl -fsS -o /dev/null "$SITE_URL/" && echo "site OK"
          curl -fsS -o /dev/null "$SITE_URL/results" && echo "deep link OK"
          # The Lambda URL itself must refuse requests that skip CloudFront.
          fn_url=$(aws lambda list-function-url-configs --function-name "$FUNCTION"             --query 'FunctionUrlConfigs[0].FunctionUrl' --output text)
          echo "::add-mask::$fn_url"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${fn_url}api/shared/abcdefghijkl")
          [ "$code" = 403 ] && echo "origin lock OK" || { echo "origin lock returned $code"; exit 1; }
          echo "### Deployed $(git rev-parse --short HEAD) to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
