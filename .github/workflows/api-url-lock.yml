name: API URL lock

# Lock: only floorpov.gg's CloudFront distribution can call the API's Lambda
# URL. CloudFront signs every /api request (origin access control) and the URL
# refuses anything unsigned, so a request sent straight to the URL is turned
# away by AWS before the function runs and costs nothing. The browser sends
# its session in X-Session-Token and a SHA-256 of each request body in
# x-amz-content-sha256, which signed POSTs need (frontend/src/api.js).
#
# Unlock: back to a public URL guarded only by the X-Origin-Verify header
# (backend/origin.py), e.g. if something breaks after locking.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: lock or unlock
        type: choice
        options: [lock, unlock]
        default: lock

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  FUNCTION: ${{ secrets.LAMBDA_FUNCTION }}
  DISTRIBUTION: ${{ secrets.CF_DISTRIBUTION_ID }}
  SITE_URL: https://floorpov.gg
  ORIGIN_ID: floorpov-api
  OAC_NAME: floorpov-api-lambda

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ${{ inputs.mode == 'lock' && 'Lock' || 'Unlock' }} the API URL
        env:
          MODE: ${{ inputs.mode }}
        run: infra/api-url-lock.sh "$MODE"
